<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Fixed Audio Player</title>
    <link rel="stylesheet" href="css/netflix-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>STREAMFLIX</h2>
            </div>
            <div class="nav-controls">
                <select id="playlist-select">
                    <option value="india">India Channels</option>
                    <option value="global">Global Channels</option>
                </select>
                <input type="text" id="search-input" placeholder="Search channels...">
                <button id="toggle-sidebar" class="btn-icon">
                    <i class="fas fa-list"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Video Player Section -->
        <section class="hero-section">
            <div class="video-container">
                <video 
                    id="video-player" 
                    class="main-video" 
                    autoplay 
                    muted 
                    playsinline
                    controls
                    crossorigin="anonymous">
                    Your browser does not support the video tag.
                </video>
                
                <!-- Channel Info Overlay -->
                <div class="channel-info-overlay">
                    <div class="channel-info-content">
                        <h1 id="current-channel-name">Select a Channel</h1>
                        <div class="channel-meta">
                            <span id="current-channel-group">Ready to Stream</span>
                            <span id="channel-resolution">HD</span>
                            <span id="channel-category">LIVE</span>
                        </div>
                    </div>
                </div>
                
                <!-- Loading Overlay -->
                <div id="loading" class="loading-overlay">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading channel...</p>
                    </div>
                </div>
            </div>
            
            <!-- Player Controls -->
            <div class="player-controls">
                <div class="control-group">
                    <button id="prev-channel" class="btn-icon">
                        <i class="fas fa-step-backward"></i>
                    </button>
                    <button id="play-pause" class="btn-icon play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                    <button id="next-channel" class="btn-icon">
                        <i class="fas fa-step-forward"></i>
                    </button>
                </div>
                
                <div class="control-group">
                    <button id="mute-toggle" class="btn-icon">
                        <i class="fas fa-volume-up"></i>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="100" value="80" class="volume-slider">
                </div>
            </div>
        </section>

        <!-- Categories Section -->
        <section class="categories-section">
            <div class="categories-container">
                <div class="category-header">
                    <h2>Live Channels</h2>
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                    </select>
                </div>
                <div id="channel-list" class="channels-grid">
                    <!-- Channels will be populated here -->
                </div>
            </div>
        </section>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Now Playing</h3>
            <button id="close-sidebar" class="btn-icon">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-channel-info">
                <img id="sidebar-channel-logo" src="" alt="" style="display: none;">
                <div>
                    <h4 id="sidebar-channel-name">No channel selected</h4>
                    <p id="sidebar-channel-info">Select a channel to start streaming</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/fixed-player.js"></script>
</body>
</html>
